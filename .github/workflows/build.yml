name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
        exclude:
          # Exclude arm64 builds on ubuntu for now
          - os: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Run tests
      run: make test

    - name: Set binary name
      id: binary
      run: |
        os_name=$(echo ${{ runner.os }} | tr '[:upper:]' '[:lower:]')
        echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        echo "name=educatesenv-${os_name}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

    - name: Build
      run: |
        GOARCH=${{ matrix.arch }} make build
        mv bin/educatesenv bin/${{ steps.binary.outputs.name }}

    - name: Upload binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.binary.outputs.name }}
        path: bin/${{ steps.binary.outputs.name }}
        retention-days: 1 